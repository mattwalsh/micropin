#channels = [1,2]
#volume = 2
#a4_period = 142

[midi_songs.fugue]
file = "../py_pin/midi/fugue.mid"
loop = true

[[midi_songs.fugue.voices]]
track = "Synth Bass"
channel = 0
a4_period = 142

[[midi_songs.fugue.voices]]
track = "8-Bit Sawtooth"
channel = 1
a4_period = 142

[[midi_songs.fugue.voices]]
track = "Pop Synth"
channel = 2
a4_period = 142

[midi_songs.parade]
file = "../py_pin/midi/parade.mid"
loop = true
start_measure = 5
end_measure = 22

[[midi_songs.parade.voices]]
track = "Elec. Piano (Classic)"
channels = [0,1,2]
a4_period = 142

[midi_songs.oxygene4]
file = "../py_pin/midi/oxygene4.mid"
loop = true

[[midi_songs.oxygene4.voices]]
track = "Bass Guitar (Classic)"
channel = 0
a4_period = 142
use_tone = true

[[midi_songs.oxygene4.voices]]
track = "Synth Pluck (Classic)"
channel = 1
a4_period = 142
noise_period = 0x01
use_noise = true

[[midi_songs.oxygene4.voices]]
track = "Smooth Synth (Classic)"
channel = 2
a4_period = 71

[midi_songs.bwv_784]
file = "../py_pin/midi/bwv_784.mid"
loop = true

[[midi_songs.bwv_784.voices]]
track = "8-bit square"
channels = [0, 1, 2]
a4_period = 142


[midi_songs.popcorn]
file = "../py_pin/midi/popcorn.mid"
loop = true
# Shared AY percussion settings. The envelope and noise rate are shared, but
# only the drum voice below enables their mixer path.
envelope_period = 0x0100
envelope_shape = 0x01
noise_period = 0x01

[[midi_songs.popcorn.voices]]
track = "Jazz Guitar"
channel = 0
a4_period = 142

[[midi_songs.popcorn.voices]]
track = "8-Bit Triangle"
channel = 1
a4_period = 142

[[midi_songs.popcorn.voices]]
track = "Electric Drum Kit"
channel = 2
a4_period = 142
use_envelope = true
use_tone = false
use_noise = true


# Popcorn's lead and accompaniment tracks, assigned to AY B and C. They use
# the shared music.midi_volume; no shared envelope is selected for this song.
[midi_songs.popcorn2]
file = "../py_pin/midi/popcorn_2.mid"
loop = true
# The drum voice below selects the shared AY envelope and noise source.
envelope_period = 0x050
envelope_shape = 0x07
noise_period = 0x02

[[midi_songs.popcorn2.voices]]
track = "Jazz Guitar"
channel = 0
a4_period = 142
priority = 0

[[midi_songs.popcorn2.voices]]
track = "Grand Piano"
channel = 0
a4_period = 142
priority = 1

[[midi_songs.popcorn2.voices]]
track = "Synthesizer"
channel = 1
use_envelope = false
a4_period = 142

[[midi_songs.popcorn2.voices]]
track = "French Horn"
channel = 2
use_envelope = false
a4_period = 142
priority = 2

[[midi_songs.popcorn2.voices]]
track = "Electric Drum Kit"
channel = 2
a4_period = 142
use_envelope = true
use_tone = true
use_noise = true
priority = 1

