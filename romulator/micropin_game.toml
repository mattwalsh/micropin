[game]
balls_per_game = 4
credit_long_press_seconds = 3.0

[high_scores]
defaults = [60000, 50000, 40000, 30000, 20000, 10000]

[holes]
settle_seconds = 0.5

# A newly launched ball is eligible for one automatic relaunch for this many
# seconds total. During the final grace_seconds, the save still counts but its
# two "same player again" lamps are deliberately dark.
[ball_save]
relaunch_seconds = 10.0
grace_seconds = 1.0

# Probability that the final match digit awards one or more credits. Use 0.0
# for never, 0.1 for one game in ten, or 1.0 to guarantee a match.
[match]
percentage = 0.25

[audio]
# Fixed AY channel-A level for game effects (1..15), independent of MIDI voices.
effects_volume = 6
# Fixed default for MIDI voices (1..15). A voice may override it, but the
# normal case intentionally keeps per-voice configuration uncluttered.
midi_volume = 4

# Persistent base layer.  Colors accept ordinary #aabbcc RGB values.
[lighting]
base = "#ffffff"
match = "#000000"
tilt = "#ff0000"
fade_seconds = 0.9

# Backgrounds are owned by game state and therefore loop for as long as that
# state is active.  A playlist chooses a fresh, non-repeated MIDI selection
# once per ball.
[backgrounds.gameplay]
midi_playlist = ["chameleon", "chase", "tubular_bells", "popcorn2", "dr_who", "fugue", "bwv_784", "oxygene4", "parade"]

# This one is intentionally light-only.  It starts when a game is waiting for
# the ball launch and ends automatically at launch.
[backgrounds.waiting_for_launch]
light_effect = "launch_flipper_pulse"

# One-shot named presentation cues.  Each cue has exactly one source:
# ``sequence`` names an existing [songs.NAME] (or built-in) sequence; a future
# MIDI cue uses ``midi = \"NAME\"`` plus optional start_measure/end_measure.
[cues.boot]
sequence = "match_win"

[cues.start]
sequence = "match_win"

[cues.launch]
sequence = "launch"

[cues.outlane]
sequence = "outlane"
[cues.outlane_save]
sequence = "outlane_save"
[cues.standup_special]
sequence = "charge"
[cues.standup_complete]
sequence = "standup_complete"
[cues.bonus_2x]
sequence = "bonus_2x"
[cues.bonus_3x]
sequence = "bonus_3x"
[cues.side_bonus_hole]
sequence = "side_bonus_hole"
[cues.tilt]
sequence = "tilt"
[cues.high_score]
midi = "cantina"
start_measure = 11
end_measure = 26
light_effect = "rainbow"
[cues.add_credit]
sequence = "add_credit"
[cues.mute_on]
sequence = "mute_on"
[cues.mute_off]
sequence = "mute_off"

[bonus]
pause_seconds = 0.75
inlane_points = 1000
tick_seconds = 0.10
entry_pause_seconds = 0.5
multiplier_pause_seconds = 0.5

[points]
lower_left_bumper = 25
upper_left_bumper = 50
middle_rollover_bumper = 100
lower_right_bumper = 10
right_sling = 5
left_sling = 5

# Safe choices are "silence", "short", "medium", and "long". This is the
# fallback for every direct sound and song which does not choose another mode.
[sound]
default_mode = "medium"

# Direct sounds inherit sound.default_mode unless they have their own mode.
[sounds.lower_left_bumper]
pitch = 0xca

[sounds.upper_left_bumper]
pitch = 0xaa

[sounds.middle_rollover_bumper]
pitch = 0x87

[sounds.lower_right_bumper]
pitch = 0x65

[sounds.right_sling]
pitch = 0x78
[sounds.left_sling]
pitch = 0xb6
[sounds.match]
pitch = 0x78
[sounds.bonus_add]
pitch = 0x87
[sounds.end_ball]
pitch = 0x15
[sounds.bonus_payout]
pitch = 0x87
[sounds.standup]
pitch = 0x87
[sounds.rollover]
pitch = 0x54
[sounds.rollover_complete]
pitch = 0xf1
[sounds.cup_lit]
pitch = 0x65
[sounds.cup_unlit]
pitch = 0x33
[sounds.cups_complete]
pitch = 0xf1

# Songs inherit sound.default_mode. A song may set `mode = "long"` once for
# all its notes, and an individual note may override it with `mode = "short"`.
# `speedup = 2.0` plays twice as fast; `speedup = 0.5` plays twice as slowly.
# A pitch of zero is a rest and automatically uses silence.
[songs.add_credit]
notes = [{ pitch = 0x78, seconds = 0.14 }]

# Host-side MIDI choices are parsed once when requested; the 8085 sees only
# compact AY register writes. `chase` is the low Synth Pluck line.
[midi_songs."chase"]
file = "../py_pin/midi/chase.mid"
loop = true
# These are the AY's single shared envelope generator.  A voice below can
# opt into it with `use_envelope = true`; fixed `volume` is then ignored.
envelope_period = 0xa00
envelope_shape = 3

[[midi_songs."chase".voices]]
track = "Synth Pluck (Classic)"
channel = 1
a4_period = 142
use_envelope = false

[[midi_songs."chase".voices]]
track = "Clean Guitar"
channel = 2
a4_period = 142
use_envelope = false

[midi_songs.tubular_bells]
file = "../py_pin/midi/tubular_bells.mid"
loop = true
# Shared AY percussion settings. The envelope and noise rate are shared, but
# only the drum voice below enables their mixer path.
envelope_period = 0x0100
envelope_shape = 0x01
noise_period = 0x01

[[midi_songs.tubular_bells.voices]]
track = "Grand Piano (Classic)"
# This track contains chords.  Keep the two highest simultaneous notes on AY
# B/C; any lower chord notes are intentionally dropped.
channels = [1, 2]
a4_period = 142

[[midi_songs.tubular_bells.voices]]
track = "Grand Piano"
channel = 0
a4_period = 142

[midi_songs.chameleon]
file = "../py_pin/midi/chameleon.mid"
loop = true
envelope_period = 0x0100
envelope_shape = 0x01
noise_period = 0x01

[[midi_songs.chameleon.voices]]
track = "Bass Guitar (Classic)"
channel = 0
a4_period = 142

[[midi_songs.chameleon.voices]]
track = "Electric Drum Kit"
channel = 1
a4_period = 142
use_envelope = true
use_tone = false
use_noise = true

[[midi_songs.chameleon.voices]]
track = "Muted E-Guitar"
channel = 2
a4_period = 142

[[midi_songs.chameleon.voices]]
track = "8-Bit Triangle"
channel = 2
a4_period = 142

[midi_songs.dr_who]
file = "../py_pin/midi/dr_who.mid"
loop = true

[[midi_songs.dr_who.voices]]
track = "Scifi"
channels = [0,1]
a4_period = 142

[[midi_songs.dr_who.voices]]
track = "8-Bit Triangle"
channel = 2
a4_period = 142

[midi_songs.cantina]
file = "../py_pin/midi/cantina2.mid"
loop = false
start_measure = 11

[[midi_songs.cantina.voices]]
track = "Grand Piano"
channels = [0,1]
a4_period = 142

#[[midi_songs.cantina.voices]]
