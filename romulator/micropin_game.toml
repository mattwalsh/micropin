[game]
balls_per_game = 4
# Temporary debugging shortcut: the back credit button launches a ball when
# waiting and the outhole confirms it is present. It never starts a game.
# Set false to disable the launch shortcut; the button still adds a credit.
credit_button_launch = true

[high_scores]
# Initial/reset table; saved NVRAM scores take precedence during normal boots.
defaults = [60000, 50000, 40000, 30000, 20000, 10000]

[holes]
settle_seconds = 0.5

# Reuse the Popcorn notes below for boot and start. Set either to "none" to
# silence it, or point it to another [[songs.NAME]] sequence.
[music]
boot = "match_win"
# Played whenever a player joins, including player 1 on a new game.
start = "match_win"
launch = "launch"
outlane = "outlane"
outlane_save = "outlane_save"
standup_special = "charge"
high_score = "funkytown"

# The R-K and Q-A inlanes each add this much to the bonus bank. Once a ball
# drains, pay it to the active player in 1,000-point steps at this interval.
[bonus]
pause_seconds = 0.75
inlane_points = 1000
tick_seconds = 0.10

# Port-1 reflex-event scoring. Each of the four bumpers and both slings is
# independently configurable.
[points]
lower_left_bumper = 10
upper_left_bumper = 10
middle_rollover_bumper = 10
lower_right_bumper = 10
right_sling = 5
left_sling = 5

# Logical pitch/duration bytes sent through the aperture. These six tuples are
# cribbed from ppm.asm's reflex sound table at $12ad-$12be. Duration zero is
# reserved for silence and is intentionally rejected by the config loader.
[sounds.lower_left_bumper]
pitch = 0xca
duration = 0x08

[sounds.upper_left_bumper]
pitch = 0xaa
duration = 0x08

[sounds.middle_rollover_bumper]
pitch = 0x87
duration = 0x08

[sounds.lower_right_bumper]
pitch = 0x65
duration = 0x08

[sounds.right_sling]
pitch = 0x78
duration = 0x08

[sounds.left_sling]
pitch = 0xb6
duration = 0x08

[sounds.match]
pitch = 0x78
duration = 0x04

[sounds.bonus_add]
pitch = 0x87
duration = 0x04

[sounds.end_ball]
# Stock ppm outhole tone, played on a settled drain, not a saved-ball relaunch.
pitch = 0x15
duration = 0x0c

# One tone for each 1,000-point bonus payout tick, including the final tick.
[sounds.bonus_payout]
pitch = 0x87
duration = 0x04

[sounds.standup]
pitch = 0x87
duration = 0x04

# First note of the original credit jingle in ppm.asm ($1341).
[sounds.credit]
pitch = 0x18
duration = 0x08

[sounds.rollover]
pitch = 0x54
duration = 0x08

[sounds.rollover_complete]
pitch = 0xf1
duration = 0x04

[sounds.cup_lit]
pitch = 0x65
duration = 0x08

[sounds.cup_unlit]
pitch = 0x33
duration = 0x04

[sounds.cups_complete]
pitch = 0xf1
duration = 0x04

